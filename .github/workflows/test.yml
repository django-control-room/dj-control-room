name: Tests

on: [push]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    name: Python ${{ matrix.python-version }} - Django ${{ matrix.django-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Django 4.2 — Python 3.9–3.12
          - python-version: "3.9"
            django-version: "4.2"
          - python-version: "3.10"
            django-version: "4.2"
          - python-version: "3.11"
            django-version: "4.2"
          - python-version: "3.12"
            django-version: "4.2"
          # Django 5.2 — Python 3.10–3.14
          - python-version: "3.10"
            django-version: "5.2"
          - python-version: "3.11"
            django-version: "5.2"
          - python-version: "3.12"
            django-version: "5.2"
          - python-version: "3.13"
            django-version: "5.2"
          - python-version: "3.14"
            django-version: "5.2"
          # Django 6.0 — Python 3.12–3.14
          - python-version: "3.12"
            django-version: "6.0"
          - python-version: "3.13"
            django-version: "6.0"
          - python-version: "3.14"
            django-version: "6.0"
          # Django 6.1 — Python 3.12–3.14
          - python-version: "3.12"
            django-version: "6.1"
          - python-version: "3.13"
            django-version: "6.1"
          - python-version: "3.14"
            django-version: "6.1"

    services:
      redis:
        image: redis:7.4.1
        ports: ["6379:6379"]
      postgres:
        image: postgres:16
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: |
            make install
            pip install "Django~=${{ matrix.django-version }}.0"

      - name: Run tests with coverage
        run: |
            make test_coverage
        env:
          TEST_DB_BACKEND: postgresql
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests,python-${{ matrix.python-version }},django-${{ matrix.django-version }}
          fail_ci_if_error: true
